version: "2"

run:
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        text: "G304: Potential file inclusion via variable"
        linters:
          - gosec
      - path: internal/(app/config_reference|config/config|app/settings)\.go
        source: "^\\s*data, err := os\\.ReadFile\\((input|path)\\)"
        text: "G304: Potential file inclusion via variable"
        linters:
          - gosec
      - path: internal/sniff/shadowsocks_cipher\.go
        text: "G401|G501|G505"
        linters:
          - gosec
      - path: internal/x365/transport\.go
        source: "^\\s*resp, err := transport\\.RoundTrip\\(req\\)"
        text: "response body must be closed and consumed"
        linters:
          - bodyclose
  settings:
    bodyclose:
      check-consumption: true
    copyloopvar:
      check-alias: true
    depguard:
      rules:
        no-risky-imports:
          deny:
            - pkg: os/exec$
              desc: use in-process APIs instead of spawning commands
            - pkg: math/rand$
              desc: use crypto/rand for security-sensitive randomness
        core-without-ui:
          files:
            - '**/internal/**/*.go'
            - '!**/internal/app/**'
            - '!**/internal/tui/**'
            - '!$test'
          deny:
            - pkg: github.com/rbee3u/efanadp/internal/app
              desc: app owns process wiring; core packages must not depend on it
            - pkg: github.com/rbee3u/efanadp/internal/tui
              desc: terminal interaction belongs in tui
            - pkg: github.com/charmbracelet/
              desc: terminal libraries belong in tui
        relay-without-application:
          files:
            - '**/internal/{proxy,x365,sniff,datagram,human}/*.go'
            - '!$test'
          deny:
            - pkg: github.com/rbee3u/efanadp/internal/config
              desc: receive normalized runtime values instead of loading application config
            - pkg: github.com/rbee3u/efanadp/internal/session
              desc: session owns service execution and depends on the relay layers
        proxy-without-carrier:
          files:
            - '**/internal/proxy/*.go'
            - '!$test'
          deny:
            - pkg: github.com/rbee3u/efanadp/internal/x365
              desc: use Upstream and standard stream errors instead of the X365 implementation
        sniff-without-relay:
          files:
            - '**/internal/sniff/*.go'
            - '!$test'
          deny:
            - pkg: github.com/rbee3u/efanadp/internal/proxy
              desc: sniff inspects payloads without owning relay or routing
            - pkg: github.com/rbee3u/efanadp/internal/x365
              desc: sniff must not depend on the carrier
            - pkg: github.com/goccy/go-yaml
              desc: YAML parsing and normalization belong in config
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: false
    govet:
      enable:
        - atomicalign
        - deepequalerrors
        - nilness
        - reflectvaluecompare
        - sortslice
        - unusedwrite
    gocritic:
      enabled-tags:
        - diagnostic
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - SA*
