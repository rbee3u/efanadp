# efanadp reference configuration.
# Copy this file to config.yaml and keep it private.
# Replace proxies_uuid with your X365 account UUID; leave proxies_tmpl unchanged.

# listen is the local SOCKS5 TCP listen address; keep it on loopback (no-auth).
listen: 127.0.0.1:10865

# log controls runtime logging; see docs/configuration.md for accepted values.
log:
  level: info
  output: logs/app.log
  format: text

# Optional Shadowsocks target labels; forwarding is unchanged.
# Match the landing server by server/port and supply its method/password.
# sniff:
#   shadowsocks:
#     - name: landing
#       server: 203.0.113.10
#       port: 39281
#       method: aes-256-gcm
#       password: <shadowsocks-password>

proxies_uuid: <your-x365-uuid>

# proxies_tmpl is zlib-compressed, base64-encoded YAML with UUID userinfo removed.
# Hosts, paths, and REALITY material remain: packaging is not redaction.
# Regenerate only for template maintenance; review output using docs/privacy.md.
